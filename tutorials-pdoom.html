<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VN2000 PRO — Video Hướng Dẫn Sử Dụng</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <style>
    :root {
      --bg: #07090e;
      --card-bg: rgba(15, 23, 42, 0.88);
      --card-border: rgba(255, 255, 255, 0.12);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --signal: #10b981;
      --gold: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    header {
      background: rgba(11, 15, 25, 0.95);
      border-bottom: 1px solid var(--card-border);
      padding: 10px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(12px);
      z-index: 100;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-badge {
      background: linear-gradient(135deg, #0284c7, #10b981);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      letter-spacing: 0.8px;
    }
    .brand h1 {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }
    .btn-header {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12.5px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-header:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: var(--accent);
    }
    .main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
      gap: 14px;
    }
    /* Video Viewport Stage */
    .stage-wrapper {
      position: relative;
      width: 100%;
      max-width: 1100px;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(56, 189, 248, 0.3);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px var(--accent-glow);
    }
    canvas#videoCanvas {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }
    /* HUD Overlay Top Bar */
    .stage-hud {
      position: absolute;
      top: 12px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }
    .hud-tag {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 11.5px;
      font-family: ui-monospace, monospace;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hud-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      from { opacity: 0.4; }
      to { opacity: 1; transform: scale(1.2); }
    }
    /* Controls Panel */
    .controls-panel {
      width: 100%;
      max-width: 1100px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      backdrop-filter: blur(16px);
    }
    .timeline-bar-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .progress-track {
      flex: 1;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 99px;
      position: relative;
      cursor: pointer;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0284c7, #38bdf8, #10b981);
      border-radius: 99px;
      transition: width 0.05s linear;
    }
    .time-label {
      font-family: ui-monospace, monospace;
      font-size: 12px;
      color: var(--text-muted);
      min-width: 85px;
      text-align: right;
    }
    .controls-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .btn-group-playback {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-ctrl {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: var(--text);
      min-height: 38px;
      padding: 0 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn-ctrl:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: var(--accent);
    }
    .btn-ctrl.btn-primary-play {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      border-color: #38bdf8;
      color: #fff;
      font-weight: 700;
      min-width: 105px;
      justify-content: center;
    }
    .audio-engine-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      background: rgba(15, 23, 42, 0.7);
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .audio-ctrl-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #94a3b8;
    }
    .audio-label {
      font-weight: 600;
      color: #cbd5e1;
      font-size: 12px;
    }
    .volume-slider {
      width: 70px;
      height: 4px;
      accent-color: #38bdf8;
      cursor: pointer;
    }
    /* Device Mode Switcher (Mobile vs Desktop Screen Size) */
    .device-switcher-group {
      display: inline-flex;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 3px;
      gap: 3px;
    }
    .btn-device-toggle {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }
    .btn-device-toggle:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.06);
    }
    .btn-device-toggle.active {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      border-color: #38bdf8;
      color: #fff;
      font-weight: 700;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.35);
    }
    /* Function Cards Selector */
    .section-title {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 6px;
    }
    .episodes-grid {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 12px;
    }
    .episode-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }
    .episode-card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    .episode-card.active {
      border-color: #0284c7;
      background: rgba(2, 132, 199, 0.14);
      box-shadow: 0 0 20px rgba(2, 132, 199, 0.35);
    }
    .episode-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .episode-badge {
      font-size: 10.5px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
    }
    .episode-card.active .episode-badge {
      background: #0284c7;
      color: #fff;
    }
    .episode-duration {
      font-size: 11px;
      font-family: ui-monospace, monospace;
      color: var(--text-muted);
    }
    .episode-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .episode-summary {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.45;
    }
    .episode-steps-pills {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .step-pill {
      font-size: 10.5px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 2px 7px;
      border-radius: 4px;
      color: #94a3b8;
    }
    .episode-card.active .step-pill {
      border-color: rgba(56, 189, 248, 0.3);
      color: #38bdf8;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span class="brand-badge">HƯỚNG DẪN</span>
      <h1>VN2000 PRO — Video Hướng Dẫn Sử Dụng</h1>
    </div>
    <div class="nav-actions">
      <a href="index.html" class="btn-header">
        <span>◀</span> Quay Lại Ứng Dụng
      </a>
    </div>
  </header>

  <main class="main-container">
    <!-- Video Canvas Stage -->
    <div class="stage-wrapper">
      <canvas id="videoCanvas" width="1920" height="1080"></canvas>
      <div class="stage-hud">
        <div class="hud-tag">
          <span class="hud-dot"></span>
          <span id="hudVideoTitle">CHỨC NĂNG 1: CHUYỂN ĐỔI TỌA ĐỘ ĐƠN ĐIỂM</span>
        </div>
        <div class="hud-tag">
          <span id="hudStepBadge">BƯỚC 1 / 3</span> • <span id="hudTime">00:00 / 00:20</span>
        </div>
      </div>
    </div>

    <!-- Controls Panel -->
    <div class="controls-panel">
      <!-- Progress Bar -->
      <div class="timeline-bar-wrap">
        <div class="progress-track" id="progressTrack" onclick="seekVideo(event)">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="time-label" id="timeLabel">00:00 / 00:20</div>
      </div>

      <!-- Control Buttons & Audio Options -->
      <div class="controls-actions">
        <div class="btn-group-playback">
          <button class="btn-ctrl btn-primary-play" id="btnPlayPause" onclick="togglePlay()">
            <span id="playIcon">▶</span> <span id="playText">Phát Video</span>
          </button>
          <button class="btn-ctrl" onclick="prevStep()" title="Bước trước">⏮ Bước trước</button>
          <button class="btn-ctrl" onclick="nextStep()" title="Bước sau">Bước sau ⏭</button>
          <button class="btn-ctrl" onclick="restartVideo()" title="Phát lại từ đầu">🔄 Phát lại</button>

          <!-- Device Switcher: Mobile vs Large/Desktop Screen -->
          <div class="device-switcher-group" title="Chuyển chế độ xem giao diện: Màn hình điện thoại hoặc Màn hình lớn máy tính bảng">
            <button type="button" class="btn-device-toggle active" id="btnDeviceMobile" onclick="setDeviceMode('mobile')">
              📱 Điện thoại
            </button>
            <button type="button" class="btn-device-toggle" id="btnDeviceDesktop" onclick="setDeviceMode('desktop')">
              💻 Màn hình lớn
            </button>
          </div>
        </div>

        <div class="audio-engine-bar">
          <!-- Ambient Piano Lo-Fi BGM -->
          <div class="audio-ctrl-item">
            <span class="audio-label">🎹 Nhạc nền:</span>
            <input type="checkbox" id="chkMusic" checked onchange="toggleMusic()">
            <input type="range" class="volume-slider" id="volMusic" min="0" max="1" step="0.05" value="0.25" oninput="updateMusicVolume(this.value)">
          </div>

          <!-- Vietnamese Voiceover TTS -->
          <div class="audio-ctrl-item">
            <span class="audio-label">🗣️ Thuyết minh:</span>
            <input type="checkbox" id="chkVoice" checked onchange="toggleVoice()">
            <input type="range" class="volume-slider" id="volVoice" min="0" max="1" step="0.05" value="0.9" oninput="updateVoiceVolume(this.value)">
            <button class="btn-ctrl" style="min-height: 28px; padding: 0 8px; font-size: 11px;" onclick="replayCurrentVoice()">Đọc lại</button>
          </div>

          <!-- Video Export -->
          <button class="btn-ctrl" style="background: rgba(16, 185, 129, 0.15); border-color: #10b981; color: #10b981;" onclick="exportVideoMp4()">
            📥 Xuất Video MP4
          </button>
        </div>
      </div>
    </div>

    <!-- Section Title: Dedicated Function Walkthroughs -->
    <div class="section-title" style="width: 100%; max-width: 1100px;">
      📂 DANH SÁCH VIDEO HƯỚNG DẪN
    </div>

    <!-- Video Cards (1 Function per Video) -->
    <div class="episodes-grid" id="episodesGrid">
      <!-- Injected by JavaScript -->
    </div>
  </main>

            focus: { x: 50, y: 30, w: 90, h: 25, label: "Khung ngắm Camera & Watermark trực tiếp" },

            text: "Thông số tọa độ VN-2000 X, Y, kinh độ, vĩ độ, ngày giờ và tên công trình được in chìm vĩnh viễn lên ảnh chụp. Nhấn nút chụp để lưu trữ hồ sơ nghiệm thu thực địa pháp lý rõ ràng, phục vụ đính kèm biên bản bàn giao mốc hoặc báo cáo tư vấn giám sát.",
            en: "Permanent watermark embeds VN-2000 X/Y, coordinates, timestamp, and project metadata directly onto high-res survey photos.",
            tip: "💡 Pháp lý: Ảnh đóng dấu được lưu với độ phân giải gốc của camera thiết bị, không thể chỉnh sửa số liệu.",
            focus: { x: 50, y: 75, w: 90, h: 20, label: "Watermark tọa độ & Nút chụp ảnh" },

    ];

    // ==========================================
    // 2. STATE & AUDIO ENGINE
    // ==========================================
    let currentEpIndex = 0;
    let isPlaying = false;
    let currentTime = 0;
    let lastTimestamp = 0;
    let animFrameId = null;

    let isMusicEnabled = true;
    let isVoiceEnabled = true;
    let musicVolume = 0.25;
    let voiceVolume = 0.9;

    let audioCtx = null;
    let bgmGainNode = null;
    let musicInterval = null;

    // Loaded image cache & Device mode state
    const imageCache = {};
    let currentDeviceMode = 'mobile'; // 'mobile' | 'desktop'

    function setDeviceMode(mode) {
      currentDeviceMode = mode;
      const btnMobile = document.getElementById('btnDeviceMobile');
      const btnDesktop = document.getElementById('btnDeviceDesktop');
      if (btnMobile) btnMobile.classList.toggle('active', mode === 'mobile');
      if (btnDesktop) btnDesktop.classList.toggle('active', mode === 'desktop');
      renderFrame(currentTime);
    }

    function preloadScreens() {
      VIDEO_EPISODES.forEach(ep => {
        ep.steps.forEach(st => {
          [st.screen, st.desktopScreen].forEach(src => {
            if (src && !imageCache[src]) {
              const img = new Image();
              img.src = src;
              imageCache[src] = img;
            }
          });
        });
      });
    }

    // ==========================================
    // 3. GENTLE AMBIENT PIANO AUDIO ENGINE
    // ==========================================
    function initAudioContext() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        bgmGainNode = audioCtx.createGain();
        bgmGainNode.gain.setValueAtTime(isMusicEnabled ? musicVolume : 0, audioCtx.currentTime);
        bgmGainNode.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    // Gentle piano chords (Cmaj7, Am7, Fmaj7, G6)
    const CHORD_NOTES = [
      [261.63, 329.63, 392.00, 493.88], // Cmaj7: C4, E4, G4, B4
      [220.00, 261.63, 329.63, 392.00], // Am7: A3, C4, E4, G4
      [174.61, 261.63, 329.63, 349.23], // Fmaj7: F3, C4, E4, F4
      [196.00, 246.94, 293.66, 392.00]  // G6: G3, B3, D4, G4
    ];
    let chordIndex = 0;
    let arpeggioNoteIndex = 0;

    function playGentlePianoNote(freq) {
      if (!audioCtx || !isMusicEnabled || musicVolume <= 0.01) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const noteGain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();

        // Warm sine + soft triangle
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);

        // Low-pass filter for warm, cozy analog piano feel
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(550, now);

        // Envelope: soft slow attack (0.12s), long gentle decay (2.8s)
        noteGain.gain.setValueAtTime(0.001, now);
        noteGain.gain.linearRampToValueAtTime(0.35, now + 0.12);
        noteGain.gain.exponentialRampToValueAtTime(0.0001, now + 2.8);

        osc.connect(filter);
        filter.connect(noteGain);
        noteGain.connect(bgmGainNode);

        osc.start(now);
        osc.stop(now + 2.9);
      } catch (err) {
        // Ignore audio glitch
      }
    }

    function startAmbientMusic() {
      if (musicInterval) clearInterval(musicInterval);
      initAudioContext();
      musicInterval = setInterval(() => {
        if (!isPlaying || !isMusicEnabled) return;
        const chord = CHORD_NOTES[chordIndex % CHORD_NOTES.length];
        const freq = chord[arpeggioNoteIndex % chord.length];
        playGentlePianoNote(freq);

        arpeggioNoteIndex++;
        if (arpeggioNoteIndex % chord.length === 0) {
          chordIndex++;
        }
      }, 700);
    }

    function stopAmbientMusic() {
      if (musicInterval) {
        clearInterval(musicInterval);
        musicInterval = null;
      }
    }

    function toggleMusic() {
      const chk = document.getElementById('chkMusic');
      isMusicEnabled = chk.checked;
      if (bgmGainNode && audioCtx) {
        bgmGainNode.gain.setValueAtTime(isMusicEnabled ? musicVolume : 0, audioCtx.currentTime);
      }
      if (isMusicEnabled && isPlaying) {
        startAmbientMusic();
      }
    }

    function updateMusicVolume(val) {
      musicVolume = parseFloat(val);
      if (bgmGainNode && audioCtx && isMusicEnabled) {
        bgmGainNode.gain.setValueAtTime(musicVolume, audioCtx.currentTime);
      }
    }

    // Helper drum beat compat function for test suite
    function playDrumBeat(type) {
      if (!audioCtx || !isMusicEnabled) return;
      playGentlePianoNote(type === 'kick' ? 130.81 : 329.63);
    }

    // ==========================================
    // 4. VIETNAMESE TTS VOICEOVER ENGINE
    // ==========================================
    let currentSpokenStepIndex = -1;

    function speakStep(text) {
      if (!isVoiceEnabled || !('speechSynthesis' in window)) return;
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'vi-VN';
        utter.rate = 1.05;
        utter.volume = voiceVolume;

        const voices = window.speechSynthesis.getVoices();
        const viVoice = voices.find(v => v.lang && v.lang.includes('vi'));
        if (viVoice) utter.voice = viVoice;

        window.speechSynthesis.speak(utter);
      } catch (e) {
        console.warn('TTS error:', e);
      }
    }

    function stopVoice() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }

    function toggleVoice() {
      const chk = document.getElementById('chkVoice');
      isVoiceEnabled = chk.checked;
      if (!isVoiceEnabled) {
        stopVoice();
      } else if (isPlaying) {
        replayCurrentVoice();
      }
    }

    function updateVoiceVolume(val) {
      voiceVolume = parseFloat(val);
    }

    function replayCurrentVoice() {
      const ep = VIDEO_EPISODES[currentEpIndex];
      const stepInfo = getCurrentStep(ep, currentTime);
      if (stepInfo && stepInfo.step) {
        speakStep(stepInfo.step.text);
      }
    }

    // ==========================================
    // 5. TIMELINE & STEP MANAGEMENT
    // ==========================================
    function getTotalDuration(ep) {
      return ep.steps.reduce((sum, s) => sum + s.duration, 0);
    }

    function getCurrentStep(ep, time) {
      let accum = 0;
      for (let i = 0; i < ep.steps.length; i++) {
        const step = ep.steps[i];
        if (time >= accum && time < accum + step.duration) {
          return {
            index: i,
            step: step,
            stepTime: time - accum,
            progress: (time - accum) / step.duration
          };
        }
        accum += step.duration;
      }
      return {
        index: ep.steps.length - 1,
        step: ep.steps[ep.steps.length - 1],
        stepTime: ep.steps[ep.steps.length - 1].duration,
        progress: 1.0
      };
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    // ==========================================
    // 6. FULL HD CANVAS RENDERER (1920x1080)
    // ==========================================
    const canvas = document.getElementById('videoCanvas');
    const ctx = canvas.getContext('2d');

    function drawComputerMousePointer(ctx, x, y, pulse) {
      ctx.save();
      // Click Ripple wave
      ctx.beginPath();
      ctx.arc(x, y, 16 * pulse, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(56, 189, 248, ${0.45 * (2 - pulse)})`;
      ctx.fill();
      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Sharp Computer Mouse Pointer Arrow
      ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
      ctx.shadowBlur = 8;
      ctx.shadowOffsetX = 3;
      ctx.shadowOffsetY = 4;

      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#090d16';
      ctx.lineWidth = 2;
      ctx.lineJoin = 'round';

      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x, y + 23);
      ctx.lineTo(x + 5.5, y + 17.5);
      ctx.lineTo(x + 11.5, y + 28.5);
      ctx.lineTo(x + 15.5, y + 26.5);
      ctx.lineTo(x + 9.5, y + 15.8);
      ctx.lineTo(x + 16.5, y + 15.8);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.restore();
    }

    function drawTouchPulse(ctx, x, y, pulse) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, 24 * pulse, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(56, 189, 248, ${0.25 * (2 - pulse)})`;
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x, y, 12, 0, Math.PI * 2);
      ctx.fillStyle = '#38bdf8';
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2.5;
      ctx.stroke();
      ctx.restore();
    }

    function renderFrame(time) {
      const ep = VIDEO_EPISODES[currentEpIndex];
      const totalDur = getTotalDuration(ep);
      const stepInfo = getCurrentStep(ep, time);
      const step = stepInfo.step;
      const stepIdx = stepInfo.index;

      // Handle voiceover triggering on step change
      if (stepIdx !== currentSpokenStepIndex && isPlaying) {
        currentSpokenStepIndex = stepIdx;
        speakStep(step.text);
      }

      const W = canvas.width;
      const H = canvas.height;
      const isDesktop = currentDeviceMode === 'desktop';

      // 1. Cinematic Background
      const bgGrad = ctx.createLinearGradient(0, 0, W, H);
      bgGrad.addColorStop(0, '#060a12');
      bgGrad.addColorStop(0.5, '#0b1329');
      bgGrad.addColorStop(1, '#05070d');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, W, H);

      // Subtle Blueprint Grid Pattern
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.04)';
      ctx.lineWidth = 1;
      for (let x = 0; x < W; x += 60) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, H);
        ctx.stroke();
      }
      for (let y = 0; y < H; y += 60) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.stroke();
      }

      // 2. Left Side: Device Screen Viewport
      let innerX, innerY, innerW, innerH;
      let cardX, cardY, cardW, cardH;

      if (!isDesktop) {
        // --- MOBILE PHONE MODE (9:16) ---
        const phoneW = 520;
        const phoneH = 940;
        const phoneX = 60;
        const phoneY = (H - phoneH) / 2;

        innerX = phoneX + 12;
        innerY = phoneY + 12;
        innerW = phoneW - 24;
        innerH = phoneH - 24;

        // Card dimensions on right
        cardX = 620;
        cardY = 70;
        cardW = 1240;
        cardH = 940;

        // Device Outer Shadow & Frame
        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
        ctx.shadowBlur = 40;
        ctx.shadowOffsetY = 20;
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.roundRect(phoneX, phoneY, phoneW, phoneH, 44);
        ctx.fill();
        ctx.restore();

        // Titanium Border
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.35)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(phoneX, phoneY, phoneW, phoneH, 44);
        ctx.stroke();

        // Screen Clip
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(innerX, innerY, innerW, innerH, 36);
        ctx.clip();

        // Screenshot
        const img = imageCache[step.screen];
        if (img && img.complete && img.naturalWidth > 0) {
          const zoom = 1.0 + Math.sin(stepInfo.progress * Math.PI) * 0.025;
          const dw = innerW * zoom;
          const dh = innerH * zoom;
          const dx = innerX - (dw - innerW) / 2;
          const dy = innerY - (dh - innerH) / 2;
          ctx.drawImage(img, dx, dy, dw, dh);
        } else {
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(innerX, innerY, innerW, innerH);
          ctx.fillStyle = '#38bdf8';
          ctx.font = '600 24px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('Đang tải giao diện điện thoại...', innerX + innerW / 2, innerY + innerH / 2);
        }

        // Spotlight Box
        if (step.focus) {
          const fx = innerX + (step.focus.x / 100) * innerW - ((step.focus.w / 100) * innerW) / 2;
          const fy = innerY + (step.focus.y / 100) * innerH - ((step.focus.h / 100) * innerH) / 2;
          const fw = (step.focus.w / 100) * innerW;
          const fh = (step.focus.h / 100) * innerH;

          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 3;
          ctx.shadowColor = '#38bdf8';
          ctx.shadowBlur = 15;
          ctx.beginPath();
          ctx.roundRect(fx, fy, fw, fh, 12);
          ctx.stroke();

          // Spotlight Tag Pill
          ctx.fillStyle = 'rgba(2, 132, 199, 0.95)';
          ctx.shadowBlur = 0;
          const labelW = ctx.measureText(step.focus.label).width + 24;
          ctx.beginPath();
          ctx.roundRect(Math.max(innerX + 6, fx), Math.max(innerY + 6, fy - 26), labelW, 22, 6);
          ctx.fill();
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 12px sans-serif';
          ctx.textAlign = 'left';
          ctx.fillText(step.focus.label, Math.max(innerX + 18, fx + 12), Math.max(innerY + 20, fy - 11));
        }

        // Touch Cursor
        const cursorPulse = 1 + Math.sin(time * 6) * 0.25;
        const curX = step.cursor ? innerX + (step.cursor.x / 100) * innerW : (innerX + innerW / 2);
        const curY = step.cursor ? innerY + (step.cursor.y / 100) * innerH : (innerY + innerH / 2);
        drawTouchPulse(ctx, curX, curY, cursorPulse);

        ctx.restore(); // End Screen Clip
      } else {
        // --- DESKTOP / TABLET LARGE SCREEN MODE (16:10) ---
        const deskW = 1040;
        const deskH = 650;
        const deskX = 60;
        const deskY = (H - deskH) / 2; // 215

        const barH = 38;
        innerX = deskX + 8;
        innerY = deskY + barH;
        innerW = deskW - 16;
        innerH = deskH - barH - 8;

        // Card dimensions on right
        cardX = 1140;
        cardY = 70;
        cardW = 720;
        cardH = 940;

        // Laptop / Monitor Outer Body
        ctx.save();
        ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
        ctx.shadowBlur = 45;
        ctx.shadowOffsetY = 22;
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.roundRect(deskX, deskY, deskW, deskH, 18);
        ctx.fill();
        ctx.restore();

        // Titanium / Chrome Border
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.35)';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.roundRect(deskX, deskY, deskW, deskH, 18);
        ctx.stroke();

        // Browser Top Bar
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.roundRect(deskX + 2, deskY + 2, deskW - 4, barH, [16, 16, 0, 0]);
        ctx.fill();

        // macOS Window Control Buttons
        ctx.fillStyle = '#ff5f56'; // Close
        ctx.beginPath(); ctx.arc(deskX + 24, deskY + 19, 6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffbd2e'; // Minimize
        ctx.beginPath(); ctx.arc(deskX + 44, deskY + 19, 6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#27c93f'; // Maximize
        ctx.beginPath(); ctx.arc(deskX + 64, deskY + 19, 6, 0, Math.PI * 2); ctx.fill();

        // Browser Address URL Bar
        const urlW = deskW - 200;
        ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
        ctx.beginPath();
        ctx.roundRect(deskX + 90, deskY + 7, urlW, 24, 6);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.fillStyle = '#94a3b8';
        ctx.font = '500 12px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('🔒 https://vn2000.pro — Màn hình chuyên dụng kỹ sư trắc địa & thi công', deskX + 104, deskY + 23);

        // Screen Clip
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(innerX, innerY, innerW, innerH, [0, 0, 12, 12]);
        ctx.clip();

        // Screenshot Desktop (Fallback to mobile if desktop not yet loaded)
        const deskSrc = step.desktopScreen || step.screen;
        const img = imageCache[deskSrc] || imageCache[step.screen];
        if (img && img.complete && img.naturalWidth > 0) {
          const zoom = 1.0 + Math.sin(stepInfo.progress * Math.PI) * 0.02;
          const dw = innerW * zoom;
          const dh = innerH * zoom;
          const dx = innerX - (dw - innerW) / 2;
          const dy = innerY - (dh - innerH) / 2;
          ctx.drawImage(img, dx, dy, dw, dh);
        } else {
          ctx.fillStyle = '#0f172a';
          ctx.fillRect(innerX, innerY, innerW, innerH);
          ctx.fillStyle = '#38bdf8';
          ctx.font = '600 24px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('Đang tải giao diện màn hình lớn...', innerX + innerW / 2, innerY + innerH / 2);
        }

        // Spotlight Box on Desktop
        if (step.focus) {
          const fx = innerX + (step.focus.x / 100) * innerW - ((step.focus.w / 100) * innerW) / 2;
          const fy = innerY + (step.focus.y / 100) * innerH - ((step.focus.h / 100) * innerH) / 2;
          const fw = (step.focus.w / 100) * innerW;
          const fh = (step.focus.h / 100) * innerH;

          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 3;
          ctx.shadowColor = '#38bdf8';
          ctx.shadowBlur = 15;
          ctx.beginPath();
          ctx.roundRect(fx, fy, fw, fh, 10);
          ctx.stroke();

          // Spotlight Tag Pill
          ctx.fillStyle = 'rgba(2, 132, 199, 0.95)';
          ctx.shadowBlur = 0;
          const labelW = ctx.measureText(step.focus.label).width + 24;
          ctx.beginPath();
          ctx.roundRect(Math.max(innerX + 6, fx), Math.max(innerY + 6, fy - 26), labelW, 22, 6);
          ctx.fill();
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 12px sans-serif';
          ctx.textAlign = 'left';
          ctx.fillText(step.focus.label, Math.max(innerX + 18, fx + 12), Math.max(innerY + 20, fy - 11));
        }

        // Sharp Computer Mouse Pointer on Desktop
        const cursorPulse = 1 + Math.sin(time * 6) * 0.25;
        const curX = step.cursor ? innerX + (step.cursor.x / 100) * innerW : (innerX + innerW / 2);
        const curY = step.cursor ? innerY + (step.cursor.y / 100) * innerH : (innerY + innerH / 2);
        drawComputerMousePointer(ctx, curX, curY, cursorPulse);

        ctx.restore(); // End Screen Clip
      }

      // 3. Right Side: Instructional Glass Card & Stepper
      ctx.save();
      ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
      ctx.lineWidth = 2;
      ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
      ctx.shadowBlur = 30;
      ctx.beginPath();
      ctx.roundRect(cardX, cardY, cardW, cardH, 24);
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      // Top Header of Card
      ctx.fillStyle = 'rgba(56, 189, 248, 0.15)';
      ctx.beginPath();
      ctx.roundRect(cardX + 36, cardY + 36, isDesktop ? 220 : 260, 36, 8);
      ctx.fill();
      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`CHỨC NĂNG ${ep.number} / 8: ${ep.badge.toUpperCase()}`, cardX + 36 + (isDesktop ? 110 : 130), cardY + 59);

      // Step Number Pill
      ctx.fillStyle = '#10b981';
      ctx.beginPath();
      ctx.roundRect(cardX + 36 + (isDesktop ? 230 : 280), cardY + 36, 150, 36, 8);
      ctx.fill();
      ctx.fillStyle = '#062817';
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText(`BƯỚC ${stepIdx + 1} / ${ep.steps.length}`, cardX + 36 + (isDesktop ? 305 : 355), cardY + 59);

      // Step Title (Adaptive Typography)
      ctx.fillStyle = '#f8fafc';
      ctx.font = isDesktop ? 'bold 27px sans-serif' : 'bold 36px sans-serif';
      ctx.textAlign = 'left';
      wrapText(ctx, step.title, cardX + 36, cardY + 115, cardW - 72, isDesktop ? 34 : 42);

      // Step Main Explanation (Vietnamese)
      ctx.fillStyle = '#e2e8f0';
      ctx.font = isDesktop ? '500 19px -apple-system, sans-serif' : '500 23px -apple-system, sans-serif';
      const textStartY = isDesktop ? (cardY + 175) : (cardY + 200);
      const textLineH = isDesktop ? 31 : 38;
      wrapText(ctx, step.text, cardX + 36, textStartY, cardW - 72, textLineH);

      // Subtitle / English Translation Card
      const subCardY = isDesktop ? (cardY + 390) : (cardY + 410);
      const subCardH = isDesktop ? 120 : 120;
      ctx.fillStyle = 'rgba(2, 132, 199, 0.12)';
      ctx.strokeStyle = 'rgba(56, 189, 248, 0.25)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.roundRect(cardX + 36, subCardY, cardW - 72, subCardH, 14);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText('SUBTITLE (ENGLISH / GLOBAL)', cardX + 56, subCardY + 26);

      ctx.fillStyle = '#cbd5e1';
      ctx.font = isDesktop ? 'italic 16px sans-serif' : 'italic 18px sans-serif';
      wrapText(ctx, step.en, cardX + 56, subCardY + 52, cardW - 112, isDesktop ? 24 : 27);

      // Practical Field Tip Pill
      if (step.tip) {
        const tipCardY = subCardY + subCardH + 16;
        const tipCardH = isDesktop ? 80 : 70;
        ctx.fillStyle = 'rgba(245, 158, 11, 0.1)';
        ctx.strokeStyle = 'rgba(245, 158, 11, 0.3)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.roundRect(cardX + 36, tipCardY, cardW - 72, tipCardH, 12);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = '#fbbf24';
        ctx.font = isDesktop ? '600 15px sans-serif' : '600 17px sans-serif';
        wrapText(ctx, step.tip, cardX + 56, tipCardY + (isDesktop ? 28 : 34), cardW - 112, 24);
      }

      // Step Timeline Progress Bars at bottom of card
      const barY = cardY + cardH - 180;
      const stepBarGap = 12;
      const totalBarW = cardW - 72;
      const singleBarW = (totalBarW - (ep.steps.length - 1) * stepBarGap) / ep.steps.length;

      for (let i = 0; i < ep.steps.length; i++) {
        const bx = cardX + 36 + i * (singleBarW + stepBarGap);
        // Track
        ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.beginPath();
        ctx.roundRect(bx, barY, singleBarW, 8, 4);
        ctx.fill();

        // Fill
        if (i < stepIdx) {
          ctx.fillStyle = '#10b981';
          ctx.beginPath();
          ctx.roundRect(bx, barY, singleBarW, 8, 4);
          ctx.fill();
        } else if (i === stepIdx) {
          ctx.fillStyle = '#38bdf8';
          ctx.beginPath();
          ctx.roundRect(bx, barY, singleBarW * stepInfo.progress, 8, 4);
          ctx.fill();
        }

        // Label under bar
        ctx.fillStyle = i === stepIdx ? '#38bdf8' : '#64748b';
        ctx.font = i === stepIdx ? 'bold 14px sans-serif' : '13px sans-serif';
        ctx.fillText(`Bước ${i + 1}`, bx, barY + 28);
      }

      // Live Voice Waveform Visualizer
      ctx.fillStyle = '#94a3b8';
      ctx.font = '600 13px sans-serif';
      ctx.fillText('GIỌNG ĐỌC THUYẾT MINH & NHẠC NỀN CHUYÊN NGHIỆP:', cardX + 36, cardY + cardH - 95);

      const waveX = cardX + 36;
      const waveY = cardY + cardH - 70;
      const numWaveBars = isDesktop ? 28 : 40;
      for (let b = 0; b < numWaveBars; b++) {
        const barH = isPlaying ? (8 + Math.sin(time * 8 + b * 0.4) * 16 + Math.cos(time * 4 + b * 0.2) * 10) : 6;
        ctx.fillStyle = isPlaying ? (b % 2 === 0 ? '#38bdf8' : '#10b981') : 'rgba(255,255,255,0.2)';
        ctx.fillRect(waveX + b * 16, waveY + 20 - barH / 2, 7, Math.max(4, barH));
      }

      // Update HTML HUD
      const elHudTitle = document.getElementById('hudVideoTitle');
      const elHudBadge = document.getElementById('hudStepBadge');
      const elHudTime = document.getElementById('hudTime');
      const elProgress = document.getElementById('progressFill');
      const elTimeLabel = document.getElementById('timeLabel');

      if (elHudTitle) elHudTitle.innerText = `CHỨC NĂNG ${ep.number} / 8: ${ep.title.toUpperCase()}`;
      if (elHudBadge) elHudBadge.innerText = `BƯỚC ${stepIdx + 1} / ${ep.steps.length}`;
      if (elHudTime) elHudTime.innerText = `${formatTime(time)} / ${formatTime(totalDur)}`;
      if (elProgress) elProgress.style.width = `${(time / totalDur) * 100}%`;
      if (elTimeLabel) elTimeLabel.innerText = `${formatTime(time)} / ${formatTime(totalDur)}`;
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        const metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
          ctx.fillText(line, x, y);
          line = words[n] + ' ';
          y += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, x, y);
    }

    // ==========================================
    // 7. ANIMATION LOOP & PLAYBACK CONTROLS
    // ==========================================
    function tick(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const delta = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      if (isPlaying) {
        currentTime += delta;
        const totalDur = getTotalDuration(VIDEO_EPISODES[currentEpIndex]);
        if (currentTime >= totalDur) {
          currentTime = 0; // Loop or finish
          currentSpokenStepIndex = -1;
        }
      }

      renderFrame(currentTime);
      animFrameId = requestAnimationFrame(tick);
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      const btn = document.getElementById('btnPlayPause');
      const icon = document.getElementById('playIcon');
      const txt = document.getElementById('playText');

      if (isPlaying) {
        icon.innerText = '⏸';
        txt.innerText = 'Tạm Dừng';
        initAudioContext();
        if (isMusicEnabled) startAmbientMusic();
        replayCurrentVoice();
      } else {
        icon.innerText = '▶';
        txt.innerText = 'Phát Video';
        stopAmbientMusic();
        stopVoice();
      }
    }

    function prevStep() {
      const ep = VIDEO_EPISODES[currentEpIndex];
      const stepInfo = getCurrentStep(ep, currentTime);
      if (stepInfo.index > 0) {
        let targetTime = 0;
        for (let i = 0; i < stepInfo.index - 1; i++) {
          targetTime += ep.steps[i].duration;
        }
        currentTime = targetTime;
        currentSpokenStepIndex = -1;
        if (isPlaying) replayCurrentVoice();
      } else {
        currentTime = 0;
        currentSpokenStepIndex = -1;
      }
    }

    function nextStep() {
      const ep = VIDEO_EPISODES[currentEpIndex];
      const stepInfo = getCurrentStep(ep, currentTime);
      if (stepInfo.index < ep.steps.length - 1) {
        let targetTime = 0;
        for (let i = 0; i <= stepInfo.index; i++) {
          targetTime += ep.steps[i].duration;
        }
        currentTime = targetTime + 0.1;
        currentSpokenStepIndex = -1;
        if (isPlaying) replayCurrentVoice();
      }
    }

    function restartVideo() {
      currentTime = 0;
      currentSpokenStepIndex = -1;
      if (isPlaying) replayCurrentVoice();
    }

    function seekVideo(e) {
      const track = document.getElementById('progressTrack');
      const rect = track.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const ratio = Math.max(0, Math.min(1, clickX / rect.width));
      const totalDur = getTotalDuration(VIDEO_EPISODES[currentEpIndex]);
      currentTime = ratio * totalDur;
      currentSpokenStepIndex = -1;
      if (isPlaying) replayCurrentVoice();
    }

    function selectEpisode(idx) {
      currentEpIndex = idx;
      currentTime = 0;
      currentSpokenStepIndex = -1;
      stopVoice();

      // Update UI cards
      document.querySelectorAll('.episode-card').forEach((card, i) => {
        card.classList.toggle('active', i === idx);
      });

      if (isPlaying) {
        replayCurrentVoice();
      }
    }

    // ==========================================
    // 8. RENDER FUNCTION SELECTION CARDS
    // ==========================================
    function renderEpisodeCards() {
      const grid = document.getElementById('episodesGrid');
      grid.innerHTML = VIDEO_EPISODES.map((ep, idx) => `
        <div class="episode-card ${idx === currentEpIndex ? 'active' : ''}" onclick="selectEpisode(${idx})">
          <div class="episode-card-top">
            <span class="episode-badge">${ep.badge.toUpperCase()}</span>
            <span class="episode-duration">${formatTime(getTotalDuration(ep))}</span>
          </div>
          <div class="episode-title">
            <span>${ep.icon}</span> ${ep.title}
          </div>
          <div class="episode-summary">${ep.summary}</div>
          <div class="episode-steps-pills">
            ${ep.steps.map((st, sIdx) => `<span class="step-pill">Bước ${sIdx + 1}</span>`).join('')}
          </div>
        </div>
      `).join('');
    }

    // ==========================================
    // 9. CLIENT-SIDE VIDEO EXPORT (MP4 / WebM)
    // ==========================================
    function exportVideoMp4() {
      const ep = VIDEO_EPISODES[currentEpIndex];
      const totalDur = getTotalDuration(ep);

      alert(`🎬 Đang chuẩn bị xuất video clip hướng dẫn chức năng: "${ep.title}" (${totalDur}s). Vui lòng không đóng trình duyệt trong khi ghi hình!`);

      const stream = canvas.captureStream(30);
      let recorder;
      try {
        recorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
      } catch (e) {
        recorder = new MediaRecorder(stream);
      }

      const chunks = [];
      recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `VN2000_HuongDan_ChucNang_${ep.number}_${ep.id}.webm`;
        a.click();
        URL.revokeObjectURL(url);
      };

      currentTime = 0;
      currentSpokenStepIndex = -1;
      isPlaying = true;
      recorder.start();

      setTimeout(() => {
        recorder.stop();
        isPlaying = false;
        alert(`✅ Đã xuất video clip hướng dẫn chức năng ${ep.number} thành công!`);
      }, totalDur * 1000 + 500);
    }

    // ==========================================
    // 10. INITIALIZATION
    // ==========================================
    window.addEventListener('DOMContentLoaded', () => {
      preloadScreens();
      renderEpisodeCards();
      renderFrame(0);
      requestAnimationFrame(tick);
    });

    // Spacebar shortcut
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
        e.preventDefault();
        togglePlay();
      }
    });
  </script>
</body>
